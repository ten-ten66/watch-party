<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font: 13px/1.6 sans-serif; margin: 0; padding: 14px; background: #16161d; color: #eee; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 8px; margin-bottom: 8px; border: 1px solid #444; border-radius: 6px; background: #22222c; color: #fff; }
    button { width: 100%; padding: 8px; margin-bottom: 6px; border: 0; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #create { background: #e50914; color: #fff; }
    #join { background: #2d6cdf; color: #fff; }
    #leave { background: #444; color: #fff; display: none; }
    #status { margin-top: 8px; padding: 8px; border-radius: 6px; background: #22222c; word-break: break-all; }
    #roomBox { display: none; }
    #roomId { font-size: 20px; letter-spacing: 3px; font-weight: bold; text-align: center; margin: 4px 0; }
    #copy { background: #2a2a35; color: #ccc; font-weight: normal; }
    .err { color: #ff7a7a; }
    label { font-size: 11px; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>🎬 My Watch Party</h1>

  <label>同期サーバーURL</label>
  <input id="server" placeholder="ws://localhost:8787">

  <div id="joinBox">
    <button id="create">ルームを作成（ホスト）</button>
    <input id="room" placeholder="ルームID（例: ABC123）" maxlength="6">
    <button id="join">ルームに参加</button>
  </div>

  <div id="roomBox">
    <div>ルームID（相手に伝えてください）</div>
    <div id="roomId"></div>
    <div id="peers"></div>
    <button id="copy">IDをコピー</button>
    <button id="leave">退出する</button>
  </div>

  <div id="status">未接続</div>

  <script src="popup.js"></script>
</body>
</html>
